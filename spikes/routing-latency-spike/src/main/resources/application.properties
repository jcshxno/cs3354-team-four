# PostgreSQL (matches docker-compose.yml)
spring.datasource.url=jdbc:postgresql://localhost:5432/northstar?reWriteBatchedInserts=true
spring.datasource.username=northstar
spring.datasource.password=northstar

# Synthetic campus size = width x height nodes. Override on the command line, e.g.
#   --spike.grid.width=316 --spike.grid.height=316
spike.grid.width=100
spike.grid.height=100
spike.seed=42
spike.reseed=false

server.port=8080
